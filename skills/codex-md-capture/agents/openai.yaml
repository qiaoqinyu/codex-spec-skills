interface:
  display_name: "Codex MD Capture"
  short_description: "Harness-aware guidance capture for Codex docs"
  default_prompt: >-
    Use $codex-md-capture to turn this session into concise, verified guidance
    updates for AGENTS.md, specs/*.md, or skill references. Reject low-evidence
    or duplicate write-backs, and do not build session-state, lifecycle, or
    structure-repair scaffolding.
